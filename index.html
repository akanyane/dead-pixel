<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="DEAD PIXEL: a top-down 2D tech-horror mystery shooter for the browser. Friday, 17:58: a pixel went dark, and nobody answered after that." />
