    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #050507;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        display: block;
        aspect-ratio: 16 / 9;
        width: min(100vw, calc(100vh * 16 / 9));
        /* dvh follows the visible area when mobile browser bars show and hide */
        width: min(100vw, calc(100dvh * 16 / 9));
        cursor: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        image-rendering: pixelated;
        outline: none;
      }
      #rotate {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #050507;
        color: #39ff88;
        font: 16px/1.4 ui-monospace, Menlo, Consolas, monospace;
        text-align: center;
        padding: 16px;
        z-index: 1;
      }
      #rotate[hidden] {
        display: none;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 4px solid #e8e8e8;
        border-radius: 8px;
        position: relative;
        animation: turn 2.4s ease-in-out infinite;
      }
      #rotate .phone::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        background: #000;
        box-shadow: 0 0 0 2px #c1121f;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        55%, 100% { transform: rotate(-90deg); }
      }
    </style>
  </head>
  <body>
    <canvas id="screen" tabindex="0" aria-label="DEAD PIXEL, game"></canvas>
    <div id="rotate" hidden><div class="phone"></div><p>turn your device sideways to play</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
